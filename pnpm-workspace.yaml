packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@mantine/core": ^9.7.2
  "@mantine/hooks": ^9.7.2
  "@rdlabo/ionic-theme-ios27": ^1.2.1
  "@tanstack/db": ^0.15.0
  "@tanstack/react-db": ^0.5.10
  "@tanstack/rxdb-db-collection": ^0.1.109
  rxdb: ^17.6.0
  rxjs: ^7.8.2
  "@types/node": ^24
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.2
  vite-plugin-pwa: ^2.0.0
  vite-plus: 0.3.2
  wrangler: ^4.151.0
  zod: ^4.6.7
  "@maskito/core": ^5.6.0
  "@maskito/kit": ^5.6.0
  "@maskito/phone": ^5.6.0
  libphonenumber-js: ^1.13.15
allowBuilds:
  esbuild: true
  lightningcss: true
  workerd: true

overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@ionic/core@9.0.9"
  - "@ionic/react-router@9.0.9"
  - "@ionic/react@9.0.9"
