packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@mantine/core": ^9.7.3
  "@mantine/hooks": ^9.7.3
  "@types/node": ^24
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.2
  vite-plus: 0.3.2
allowBuilds:
  esbuild: true
  lightningcss: true

overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@ionic/core@9.0.9"
  - "@ionic/react-router@9.0.9"
  - "@ionic/react@9.0.9"
